<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                justify-content: flex-end;
                font-family: Arial, sans-serif;
                background: linear-gradient(110deg, #0b1535 0%, #1d4ed8 100%);
            }

            .login-page {
                margin-top: 12vh;
                width: 60vw;
                height: 76vh;
                display: grid;
                place-items: center;
                background: rgba(8, 18, 53, 0.72);
                border: 1px solid rgba(191, 219, 254, 0.22);
                border-radius: 45% 0 0 45%;
                box-shadow: -24px 0 70px rgba(3, 7, 25, 0.24);
                -webkit-backdrop-filter: blur(16px);
                backdrop-filter: blur(16px);
            }

            .login-form {
                width: min(380px, 75%);
                padding: 40px;
            }

            .login-form h1 {
                margin: 0 0 8px;
                color: #f8fafc;
            }

            .login-form p {
                margin: 0 0 24px;
                color: #cbdaf5;
            }

            .login-form label {
                display: block;
                margin: 16px 0 6px;
                color: #e0edff;
                font-size: 14px;
                font-weight: 600;
            }

            .login-form input {
                width: 100%;
                padding: 12px;
                color: #f8fafc;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(219, 234, 254, 0.28);
                border-radius: 10px;
                outline: none;
                transition: border-color 160ms ease, box-shadow 160ms ease;
            }

            .login-form input::placeholder {
                color: #b7c9e8;
            }

            .login-form input:focus {
                border-color: #7dd3fc;
                box-shadow: 0 0 0 3px rgba(125, 211, 252, 0.18);
            }

            .login-form button {
                width: 100%;
                margin-top: 22px;
                padding: 12px;
                color: #ffffff;
                background: linear-gradient(135deg, #0ea5e9, #4f46e5);
                border: 0;
                border-radius: 10px;
                cursor: pointer;
                font-weight: 700;
                box-shadow: 0 8px 18px rgba(14, 165, 233, 0.24);
                transition: transform 160ms ease, box-shadow 160ms ease;
            }

            .login-form button:hover {
                transform: translateY(-2px);
                box-shadow: 0 12px 22px rgba(14, 165, 233, 0.34);
            }

            .ball {
                position: fixed;
                top: 50%;
                left: 15vw;
                width: 54px;
                height: 54px;
                border-radius: 50%;
                background: radial-gradient(
                    circle at 30% 25%,
                    #e0f2fe 0%,
                    #7dd3fc 24%,
                    #3b82f6 62%,
                    #312e81 100%
                );
                border: 1px solid rgba(219, 234, 254, 0.7);
                box-shadow:
                    inset -7px -9px 14px rgba(15, 23, 42, 0.28),
                    0 0 18px rgba(96, 165, 250, 0.48),
                    0 0 42px rgba(59, 130, 246, 0.25);
                transform: translateY(-50%);
                z-index: 1;
            }

            .ball::after {
                content: "";
                position: absolute;
                inset: -10px;
                border-radius: 50%;
                border: 1px solid rgba(191, 219, 254, 0.24);
                box-shadow: 0 0 22px rgba(96, 165, 250, 0.16);
                pointer-events: none;
            }

            @media (max-width: 650px) {
                .login-page {
                    width: 82vw;
                    height: 100vh;
                    margin-top: 0;
                    border-radius: 35% 0 0 35%;
                }

                .login-form {
                    width: 88%;
                    padding: 28px 18px;
                }

                .ball {
                    left: 0;
                    width: 42px;
                    height: 42px;
                }
            }
        </style>
    </head>
    <body>
        <main class="login-page">
            <form class="login-form">
                <h1>Welcome back</h1>
                <p>Log in to your account</p>

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                />

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                />

                <button type="submit">Log In</button>
            </form>
        </main>

        <div class="ball"></div>
        <script>
            const ball = document.querySelector('.ball');

            let x = 0;
            let direction = 1;
            const travel = window.innerWidth <= 650 ? 8 : 28;

            function moveBall() {
                x += 0.5 * direction;
                if (x >= travel || x <= -travel) {
                    direction *= -1;
                }

                ball.style.transform = `translate(${x}px, -50%)`;
                requestAnimationFrame(moveBall);
            }

            moveBall();
        </script>
    </body>
</html>
